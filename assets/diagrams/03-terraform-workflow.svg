<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="tfHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="tfShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="tfArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366F1" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 22px; fill: #FFFFFF; }
    .subtitle { font-weight: 500; font-size: 12px; fill: #94A3B8; }
    .step-head { font-weight: 700; font-size: 11px; fill: #FFFFFF; letter-spacing: 0.5px; }
    .card-title { font-weight: 700; font-size: 13px; fill: #0F172A; }
    .card-desc { font-weight: 400; font-size: 11px; fill: #475569; line-height: 1.5; }
  </style>

  <rect width="1600" height="1000" fill="#F8FAFC"/>

  <!-- Header Banner -->
  <rect x="30" y="20" width="1540" height="90" rx="10" fill="url(#tfHeadGrad)" filter="url(#tfShadow)"/>
  <text class="font-sans title" x="60" y="55">TERRAFORM INFRASTRUCTURE AS CODE (IaC) AUTOMATION WORKFLOW</text>
  <text class="font-sans subtitle" x="60" y="80">End-to-End Azure Infrastructure Provisioning | Reusable Modules | Remote State with Blob Locking | Multi-Environment Workspaces | Shift-Left Security</text>

  <!-- Author Badge -->
  <g transform="translate(1220, 32)">
    <rect width="320" height="66" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1.5"/>
    <text class="font-sans" x="20" y="25" fill="#818CF8" font-size="11" font-weight="700">TERRAFORM ARCHITECTURE</text>
    <text class="font-sans" x="20" y="44" fill="#FFFFFF" font-size="12" font-weight="700">Osama Khalil</text>
    <text class="font-sans" x="20" y="58" fill="#94A3B8" font-size="10">Senior Engineer – DevOps | Azure IaC Specialist</text>
  </g>

  <!-- Main Canvas -->
  <g transform="translate(30, 130)">
    <rect width="1540" height="840" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#tfShadow)"/>

    <!-- ================= 6 HORIZONTAL PIPELINE STEPS ================= -->
    <!-- Step 1: Git Repository -->
    <g transform="translate(30, 30)">
      <rect width="225" height="420" rx="8" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.5"/>
      <rect x="0" y="0" width="225" height="34" rx="8" fill="#6366F1"/>
      <text class="font-sans step-head" x="12" y="22">1. GIT REPOSITORY</text>

      <g transform="translate(15, 50)">
        <text class="font-sans card-title" x="0" y="16">Azure Repos / GitHub</text>
        <text class="font-sans" x="0" y="34" fill="#4F46E5" font-size="10.5" font-weight="600">Trunk-Based / Git Flow</text>

        <rect y="48" width="195" height="1" fill="#E2E8F0"/>
        
        <g transform="translate(0, 60)">
          <text class="font-sans card-desc" x="0" y="14">• Feature branch isolation</text>
          <text class="font-sans card-desc" x="0" y="32">  (`feat/infra-postgres`)</text>
          <text class="font-sans card-desc" x="0" y="54">• Strict branch protection</text>
          <text class="font-sans card-desc" x="0" y="74">• Mandatory peer reviews</text>
          <text class="font-sans card-desc" x="0" y="94">• Linked work items (JIRA)</text>
          <text class="font-sans card-desc" x="0" y="114">• Automated PR builds</text>
          <text class="font-sans card-desc" x="0" y="134">• Zero direct pushes</text>
        </g>
      </g>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 260 220 L 285 220" stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#tfArrow)"/>

    <!-- Step 2: Terraform Source Code -->
    <g transform="translate(290, 30)">
      <rect width="225" height="420" rx="8" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.5"/>
      <rect x="0" y="0" width="225" height="34" rx="8" fill="#3B82F6"/>
      <text class="font-sans step-head" x="12" y="22">2. TERRAFORM CODE</text>

      <g transform="translate(15, 50)">
        <text class="font-sans card-title" x="0" y="16">Root Configuration</text>
        <text class="font-sans" x="0" y="34" fill="#2563EB" font-size="10.5" font-weight="600">Declarative HCL2 Syntax</text>

        <rect y="48" width="195" height="1" fill="#E2E8F0"/>

        <g transform="translate(0, 60)">
          <text class="font-sans card-desc" x="0" y="14">• `main.tf` (Orchestration)</text>
          <text class="font-sans card-desc" x="0" y="34">• `variables.tf` (Strict types)</text>
          <text class="font-sans card-desc" x="0" y="54">• `outputs.tf` (State exports)</text>
          <text class="font-sans card-desc" x="0" y="74">• `providers.tf` (azurerm)</text>
          <text class="font-sans card-desc" x="0" y="94">• `backend.tf` (Remote state)</text>
          <text class="font-sans card-desc" x="0" y="114">• Semantic version pins</text>
          <text class="font-sans card-desc" x="0" y="134">• DRY code principles</text>
        </g>
      </g>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 520 220 L 545 220" stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#tfArrow)"/>

    <!-- Step 3: Reusable Modules -->
    <g transform="translate(550, 30)">
      <rect width="225" height="420" rx="8" fill="#F8FAFC" stroke="#0D9488" stroke-width="1.5"/>
      <rect x="0" y="0" width="225" height="34" rx="8" fill="#0D9488"/>
      <text class="font-sans step-head" x="12" y="22">3. REUSABLE MODULES</text>

      <g transform="translate(15, 50)">
        <text class="font-sans card-title" x="0" y="16">Child Module Registry</text>
        <text class="font-sans" x="0" y="34" fill="#0D9488" font-size="10.5" font-weight="600">Enterprise Library</text>

        <rect y="48" width="195" height="1" fill="#E2E8F0"/>

        <g transform="translate(0, 60)">
          <text class="font-sans card-desc" x="0" y="14">• `modules/vnet`</text>
          <text class="font-sans card-desc" x="0" y="34">• `modules/subnets`</text>
          <text class="font-sans card-desc" x="0" y="54">• `modules/nsg` (Security)</text>
          <text class="font-sans card-desc" x="0" y="74">• `modules/linux_vm`</text>
          <text class="font-sans card-desc" x="0" y="94">• `modules/postgresql`</text>
          <text class="font-sans card-desc" x="0" y="114">• `modules/storage_account`</text>
          <text class="font-sans card-desc" x="0" y="134">• `modules/key_vault`</text>
        </g>
      </g>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M 780 220 L 805 220" stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#tfArrow)"/>

    <!-- Step 4: Environment Config & Workspaces -->
    <g transform="translate(810, 30)">
      <rect width="225" height="420" rx="8" fill="#F8FAFC" stroke="#475569" stroke-width="1.5"/>
      <rect x="0" y="0" width="225" height="34" rx="8" fill="#475569"/>
      <text class="font-sans step-head" x="12" y="22">4. ENV CONFIG &amp; WORKSPACES</text>

      <g transform="translate(15, 50)">
        <text class="font-sans card-title" x="0" y="16">Multi-Env Workspaces</text>
        <text class="font-sans" x="0" y="34" fill="#475569" font-size="10.5" font-weight="600">Dev / Stage / Prod</text>

        <rect y="48" width="195" height="1" fill="#E2E8F0"/>

        <g transform="translate(0, 60)">
          <text class="font-sans card-desc" x="0" y="14">• &lt;b&gt;DEV:&lt;/b&gt; `dev.tfvars`</text>
          <text class="font-sans card-desc" x="0" y="34">• &lt;b&gt;STAGE:&lt;/b&gt; `stage.tfvars`</text>
          <text class="font-sans card-desc" x="0" y="54">• &lt;b&gt;PROD:&lt;/b&gt; `prod.tfvars`</text>
          <text class="font-sans card-desc" x="0" y="74">• Workspace state isolation</text>
          <text class="font-sans card-desc" x="0" y="94">• Sizing variable overrides</text>
          <text class="font-sans card-desc" x="0" y="114">• Granular cost tags</text>
          <text class="font-sans card-desc" x="0" y="134">• Zero hardcoding</text>
        </g>
      </g>
    </g>

    <!-- Arrow 4 to 5 -->
    <path d="M 1040 220 L 1065 220" stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#tfArrow)"/>

    <!-- Step 5: Shift-Left & Plan -->
    <g transform="translate(1070, 30)">
      <rect width="225" height="420" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
      <rect x="0" y="0" width="225" height="34" rx="8" fill="#D97706"/>
      <text class="font-sans step-head" x="12" y="22">5. SECURITY SCAN &amp; PLAN</text>

      <g transform="translate(15, 50)">
        <text class="font-sans card-title" x="0" y="16">Shift-Left Quality Gates</text>
        <text class="font-sans" x="0" y="34" fill="#B45309" font-size="10.5" font-weight="600">Validation &amp; Speculative Plan</text>

        <rect y="48" width="195" height="1" fill="#FDE68A"/>

        <g transform="translate(0, 60)">
          <text class="font-sans card-desc" x="0" y="14">• `terraform fmt -check`</text>
          <text class="font-sans card-desc" x="0" y="34">• `terraform validate`</text>
          <text class="font-sans card-desc" x="0" y="54">• &lt;b&gt;tflint&lt;/b&gt; (Linter checks)</text>
          <text class="font-sans card-desc" x="0" y="74">• &lt;b&gt;Checkov &amp; tfsec&lt;/b&gt; (IaC scan)</text>
          <text class="font-sans card-desc" x="0" y="94">• `terraform plan -out`</text>
          <text class="font-sans card-desc" x="0" y="114">• PR plan summary comment</text>
          <text class="font-sans card-desc" x="0" y="134">• Manual approval gate</text>
        </g>
      </g>
    </g>

    <!-- Arrow 5 to 6 -->
    <path d="M 1300 220 L 1325 220" stroke="#6366F1" stroke-width="2.5" fill="none" marker-end="url(#tfArrow)"/>

    <!-- Step 6: Azure Deployment -->
    <g transform="translate(1330, 30)">
      <rect width="180" height="420" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#059669"/>
      <text class="font-sans step-head" x="10" y="22">6. AZURE DEPLOY</text>

      <g transform="translate(12, 50)">
        <text class="font-sans card-title" x="0" y="16">Apply Stage</text>
        <text class="font-sans" x="0" y="34" fill="#065F46" font-size="10.5" font-weight="600">Target Infra</text>

        <rect y="48" width="155" height="1" fill="#A7F3D0"/>

        <g transform="translate(0, 60)">
          <text class="font-sans card-desc" x="0" y="14">• `terraform apply`</text>
          <text class="font-sans card-desc" x="0" y="34">• SPN Authentication</text>
          <text class="font-sans card-desc" x="0" y="54">• VNet &amp; Subnets</text>
          <text class="font-sans card-desc" x="0" y="74">• NSG Security Rules</text>
          <text class="font-sans card-desc" x="0" y="94">• Linux VM (RHEL)</text>
          <text class="font-sans card-desc" x="0" y="114">• PostgreSQL Flexible</text>
          <text class="font-sans card-desc" x="0" y="134">• Zero configuration drift</text>
        </g>
      </g>
    </g>

    <!-- ================= LOWER ROW: REMOTE STATE & ENVIRONMENT MATURITY ================= -->
    <!-- Left: Remote State Architecture -->
    <g transform="translate(30, 480)">
      <rect width="720" height="330" rx="8" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
      <rect x="0" y="0" width="720" height="34" rx="8" fill="#0078D4"/>
      <text class="font-sans step-head" x="15" y="22">REMOTE STATE MANAGEMENT (AZURE BLOB STORAGE BACKEND)</text>

      <g transform="translate(20, 50)">
        <rect width="680" height="80" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
        <text class="font-sans" x="15" y="24" fill="#1E40AF" font-weight="700" font-size="11.5">Azure Blob Storage Backend Architecture</text>
        <text class="font-sans card-desc" x="15" y="44">• Resource Group: `rg-terraform-mgmt` | Storage Account: `sttfstateprod01`</text>
        <text class="font-sans card-desc" x="15" y="64">• Blob Container: `tfstate` with state file isolation per environment &amp; workspace</text>

        <!-- 3 Blob State Cards -->
        <g transform="translate(0, 95)">
          <!-- Dev State -->
          <rect width="215" height="95" rx="6" fill="#F8FAFC" stroke="#10B981" stroke-width="1.5"/>
          <text class="font-sans" x="12" y="24" fill="#065F46" font-weight="700" font-size="11">dev.terraform.tfstate</text>
          <text class="font-sans card-desc" x="12" y="44">Workspace: `dev`</text>
          <text class="font-sans card-desc" x="12" y="62">Lock: Azure Blob Lease</text>
          <text class="font-sans" x="12" y="82" fill="#059669" font-size="10" font-weight="600">✔ Lease Status: Available</text>

          <!-- Stage State -->
          <g transform="translate(230, 0)">
            <rect width="215" height="95" rx="6" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5"/>
            <text class="font-sans" x="12" y="24" fill="#0369A1" font-weight="700" font-size="11">stage.terraform.tfstate</text>
            <text class="font-sans card-desc" x="12" y="44">Workspace: `stage`</text>
            <text class="font-sans card-desc" x="12" y="62">Lock: Azure Blob Lease</text>
            <text class="font-sans" x="12" y="82" fill="#0284C7" font-size="10" font-weight="600">✔ Lease Status: Available</text>
          </g>

          <!-- Prod State -->
          <g transform="translate(460, 0)">
            <rect width="220" height="95" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
            <text class="font-sans" x="12" y="24" fill="#991B1B" font-weight="700" font-size="11">prod.terraform.tfstate</text>
            <text class="font-sans card-desc" x="12" y="44">Workspace: `prod`</text>
            <text class="font-sans card-desc" x="12" y="62">Lock: Azure Blob Lease</text>
            <text class="font-sans" x="12" y="82" fill="#DC2626" font-size="10" font-weight="600">🔒 Lease Status: Protected</text>
          </g>
        </g>

        <!-- State Benefits Footer -->
        <rect y="205" width="680" height="55" rx="6" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text class="font-sans" x="15" y="24" fill="#334155" font-size="10.5" font-weight="700">Enterprise State Security &amp; Concurrency Control:</text>
        <text class="font-sans card-desc" x="15" y="42">Automated blob leasing prevents race conditions; 256-bit AES encryption at rest; strict RBAC access.</text>
      </g>
    </g>

    <!-- Right: Multi-Environment Promotion -->
    <g transform="translate(780, 480)">
      <rect width="730" height="330" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
      <rect x="0" y="0" width="730" height="34" rx="8" fill="#059669"/>
      <text class="font-sans step-head" x="15" y="22">MULTI-ENVIRONMENT DEPLOYMENT PROMOTION (DEV, STAGE, PROD)</text>

      <g transform="translate(20, 50)">
        <!-- Dev Row -->
        <rect width="690" height="75" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="1.2"/>
        <text class="font-sans" x="15" y="24" fill="#065F46" font-weight="700" font-size="11.5">DEVELOPMENT (DEV)</text>
        <text class="font-sans" x="180" y="24" fill="#059669" font-size="10.5">Subscription: `sub-telecom-dev` | Workspace: `dev`</text>
        <text class="font-sans card-desc" x="15" y="46">• Automated provisioning upon Pull Request merge to main branch</text>
        <text class="font-sans card-desc" x="15" y="64">• Cost-optimized sizing for agile engineering iteration &amp; automated test coverage</text>

        <!-- Stage Row -->
        <g transform="translate(0, 85)">
          <rect width="690" height="75" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/>
          <text class="font-sans" x="15" y="24" fill="#0C4A6E" font-weight="700" font-size="11.5">STAGE (PRE-PRODUCTION)</text>
          <text class="font-sans" x="220" y="24" fill="#0284C7" font-size="10.5">Subscription: `sub-telecom-stage` | Workspace: `stage`</text>
          <text class="font-sans card-desc" x="15" y="46">• Identical architecture &amp; network topologies to production for realistic testing</text>
          <text class="font-sans card-desc" x="15" y="64">• End-to-end integration, performance profiling &amp; schema upgrade dry runs</text>
        </g>

        <!-- Prod Row -->
        <g transform="translate(0, 170)">
          <rect width="690" height="85" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
          <text class="font-sans" x="15" y="24" fill="#78350F" font-weight="700" font-size="11.5">PRODUCTION (PROD)</text>
          <text class="font-sans" x="185" y="24" fill="#B45309" font-size="10.5">Subscription: `sub-telecom-prod` | Workspace: `prod`</text>
          <text class="font-sans card-desc" x="15" y="46">• Strict RBAC governance (Zero direct Contributor rights; deployments via pipeline)</text>
          <text class="font-sans card-desc" x="15" y="64">• Mandatory Change Advisory Review &amp; manual multi-person approval gate</text>
          <text class="font-sans card-desc" x="15" y="80">• High availability zone-redundancy, automated backups &amp; 24/7 observability</text>
        </g>
      </g>
    </g>
  </g>
</svg>