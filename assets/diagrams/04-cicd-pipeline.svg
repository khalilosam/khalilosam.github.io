<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="cicdHeadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cicdShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="cicdArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0284C7" />
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669" />
    </marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7C3AED" />
    </marker>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 22px; fill: #FFFFFF; }
    .subtitle { font-weight: 500; font-size: 12px; fill: #94A3B8; }
    .phase-head { font-weight: 700; font-size: 12px; fill: #0F172A; letter-spacing: 0.5px; }
    .card-title { font-weight: 700; font-size: 12px; fill: #0F172A; }
    .card-desc { font-weight: 400; font-size: 11px; fill: #475569; line-height: 1.5; }
  </style>

  <rect width="1600" height="1000" fill="#F8FAFC"/>

  <!-- Top Banner -->
  <rect x="30" y="20" width="1540" height="90" rx="10" fill="url(#cicdHeadGrad)" filter="url(#cicdShadow)"/>
  <text class="font-sans title" x="60" y="55">ENTERPRISE CI/CD PIPELINE ARCHITECTURE (AZURE DEVOPS &amp; GITHUB ACTIONS)</text>
  <text class="font-sans subtitle" x="60" y="80">End-to-End Delivery Lifecycle | YAML Multi-Stage Pipelines | Branch Policies | Automated Build, Test &amp; Deployment to Azure Linux &amp; Storage</text>

  <!-- Author Badge -->
  <g transform="translate(1220, 32)">
    <rect width="320" height="66" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1.5"/>
    <text class="font-sans" x="20" y="25" fill="#38BDF8" font-size="11" font-weight="700">CI/CD PIPELINE ARCHITECTURE</text>
    <text class="font-sans" x="20" y="44" fill="#FFFFFF" font-size="12" font-weight="700">Osama Khalil</text>
    <text class="font-sans" x="20" y="58" fill="#94A3B8" font-size="10">Senior Engineer – DevOps | CI/CD &amp; Automation Specialist</text>
  </g>

  <!-- Main Canvas -->
  <g transform="translate(30, 130)">
    <rect width="1540" height="840" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#cicdShadow)"/>

    <!-- ================= PHASE 1: SOURCE CONTROL & GOVERNANCE ================= -->
    <g transform="translate(30, 30)">
      <rect width="460" height="780" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
      <rect x="0" y="0" width="460" height="36" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text class="font-sans phase-head" x="18" y="23">PHASE 1: SOURCE CONTROL &amp; BRANCH GOVERNANCE</text>

      <g transform="translate(20, 50)">
        <!-- Step 1: Developer -->
        <rect width="420" height="110" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
        <text class="font-sans card-title" x="15" y="26">1. Developer Workstation (Inner Loop)</text>
        <text class="font-sans card-desc" x="15" y="46">• Linux / macOS / VS Code engineering environment</text>
        <text class="font-sans card-desc" x="15" y="66">• FastAPI API development &amp; telecom UI updates</text>
        <text class="font-sans card-desc" x="15" y="86">• Local unit tests, formatting (black/flake8) &amp; signed commits</text>

        <!-- Arrow 1 to 2 -->
        <path d="M 210 115 L 210 145" stroke="#0284C7" stroke-width="2" fill="none" marker-end="url(#cicdArrow)"/>

        <!-- Step 2: Feature Branch -->
        <g transform="translate(0, 150)">
          <rect width="420" height="105" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
          <text class="font-sans card-title" x="15" y="26">2. Git Feature Branch (`feat/nms-api-v2`)</text>
          <text class="font-sans card-desc" x="15" y="46">• Branched from latest protected `main` branch</text>
          <text class="font-sans card-desc" x="15" y="66">• Atomic commits with standardized commit syntax</text>
          <text class="font-sans card-desc" x="15" y="86">• Pushed to remote Azure Repos / GitHub repository</text>
        </g>

        <!-- Arrow 2 to 3 -->
        <path d="M 210 260 L 210 290" stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#purpleArrow)"/>

        <!-- Step 3: Pull Request -->
        <g transform="translate(0, 295)">
          <rect width="420" height="115" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
          <text class="font-sans card-title" x="15" y="26">3. Pull Request (PR) Initiated</text>
          <text class="font-sans card-desc" x="15" y="46">• PR created targeting `main` branch</text>
          <text class="font-sans card-desc" x="15" y="66">• Mandatory linkage to JIRA user story / bug fix</text>
          <text class="font-sans card-desc" x="15" y="86">• Detailed summary of architectural &amp; schema changes</text>
          <text class="font-sans card-desc" x="15" y="104">• Automated PR build pipeline triggered immediately</text>
        </g>

        <!-- Arrow 3 to 4 -->
        <path d="M 210 415 L 210 445" stroke="#DC2626" stroke-width="2" fill="none" marker-end="url(#purpleArrow)"/>

        <!-- Step 4: Code Review & Branch Policies -->
        <g transform="translate(0, 450)">
          <rect width="420" height="160" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
          <text class="font-sans" x="15" y="26" fill="#991B1B" font-weight="700" font-size="12">4. Code Review &amp; Branch Policy Gates</text>
          <g transform="translate(15, 45)">
            <rect width="390" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5"/>
            <text class="font-sans" x="10" y="17" fill="#B91C1C" font-size="10.5" font-weight="600">✔ Minimum 2 peer code reviews approved</text>

            <rect y="30" width="390" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5"/>
            <text class="font-sans" x="10" y="17" fill="#B91C1C" font-size="10.5" font-weight="600">✔ Automated PR CI build &amp; test status: SUCCEEDED</text>

            <rect y="60" width="390" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5"/>
            <text class="font-sans" x="10" y="17" fill="#B91C1C" font-size="10.5" font-weight="600">✔ All review comments &amp; suggestions resolved</text>

            <rect y="90" width="390" height="24" rx="4" fill="#FFFFFF" stroke="#FCA5A5"/>
            <text class="font-sans" x="10" y="17" fill="#B91C1C" font-size="10.5" font-weight="600">✔ Direct push to main branch strictly prohibited</text>
          </g>
        </g>

        <!-- Merge to Main -->
        <g transform="translate(0, 630)">
          <rect width="420" height="60" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
          <text class="font-sans" x="15" y="25" fill="#15803D" font-weight="700" font-size="11.5">Merge to `main` Branch (Trunk)</text>
          <text class="font-sans card-desc" x="15" y="45">Fast-forward / squash merge automatically kicks off the CI/CD Pipeline</text>
        </g>
      </g>
    </g>

    <!-- Arrow between Phase 1 and Phase 2 -->
    <path d="M 495 675 L 530 675 L 530 200 L 565 200" stroke="#16A34A" stroke-width="2.5" fill="none" marker-end="url(#greenArrow)"/>

    <!-- ================= PHASE 2: CONTINUOUS INTEGRATION (CI) ================= -->
    <g transform="translate(520, 30)">
      <rect width="460" height="780" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.2"/>
      <rect x="0" y="0" width="460" height="36" rx="8" fill="#E0F2FE" stroke="#BAE6FD"/>
      <text class="font-sans phase-head" x="18" y="23" fill="#0369A1">PHASE 2: CONTINUOUS INTEGRATION (CI PIPELINE)</text>

      <g transform="translate(20, 50)">
        <!-- CI Pipeline Header -->
        <rect width="420" height="70" rx="8" fill="#FFFFFF" stroke="#0078D4" stroke-width="2"/>
        <text class="font-sans card-title" x="15" y="28">Azure DevOps Pipelines / GitHub Actions</text>
        <text class="font-sans card-desc" x="15" y="48">YAML-Defined Multi-Stage Pipeline (`azure-pipelines.yml`)</text>

        <!-- Stage 1: Linting -->
        <g transform="translate(0, 90)">
          <rect width="420" height="110" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="26" rx="8" fill="#0284C7"/>
          <text class="font-sans" x="12" y="18" fill="#FFFFFF" font-weight="700" font-size="11">STAGE 1: CODE QUALITY &amp; LINTING</text>
          
          <g transform="translate(15, 36)">
            <text class="font-sans card-desc" x="0" y="14">• &lt;b&gt;Python Flake8 / Black:&lt;/b&gt; Enforce PEP8 &amp; formatting</text>
            <text class="font-sans card-desc" x="0" y="34">• &lt;b&gt;yamllint:&lt;/b&gt; Validate Kubernetes &amp; pipeline YAML definitions</text>
            <text class="font-sans card-desc" x="0" y="54">• &lt;b&gt;ShellCheck:&lt;/b&gt; Bash deployment script verification</text>
          </g>
        </g>

        <!-- Stage 2: Automated Tests -->
        <g transform="translate(0, 220)">
          <rect width="420" height="115" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="26" rx="8" fill="#0284C7"/>
          <text class="font-sans" x="12" y="18" fill="#FFFFFF" font-weight="700" font-size="11">STAGE 2: AUTOMATED TESTING &amp; BUILD</text>

          <g transform="translate(15, 36)">
            <text class="font-sans card-desc" x="0" y="14">• &lt;b&gt;pytest:&lt;/b&gt; FastAPI endpoints, routing &amp; handler test suites</text>
            <text class="font-sans card-desc" x="0" y="34">• Database mock integration tests with PostgreSQL schemas</text>
            <text class="font-sans card-desc" x="0" y="54">• Code coverage calculation &amp; test report publication</text>
          </g>
        </g>

        <!-- Stage 3: Shift-Left Security -->
        <g transform="translate(0, 355)">
          <rect width="420" height="115" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="26" rx="8" fill="#D97706"/>
          <text class="font-sans" x="12" y="18" fill="#FFFFFF" font-weight="700" font-size="11">STAGE 3: SHIFT-LEFT SECURITY &amp; COMPLIANCE</text>

          <g transform="translate(15, 36)">
            <text class="font-sans card-desc" x="0" y="14">• &lt;b&gt;Checkov &amp; tfsec:&lt;/b&gt; Scan Terraform IaC for misconfigurations</text>
            <text class="font-sans card-desc" x="0" y="34">• Detect overly permissive NSG rules or public storage</text>
            <text class="font-sans card-desc" x="0" y="54">• Secret scanning: ensure zero API keys or credentials committed</text>
          </g>
        </g>

        <!-- Stage 4: Package Artifacts -->
        <g transform="translate(0, 490)">
          <rect width="420" height="125" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
          <rect x="0" y="0" width="420" height="26" rx="8" fill="#16A34A"/>
          <text class="font-sans" x="12" y="18" fill="#FFFFFF" font-weight="700" font-size="11">STAGE 4: ARTIFACT GENERATION &amp; PUBLISHING</text>

          <g transform="translate(15, 36)">
            <text class="font-sans card-desc" x="0" y="14">• Compile and minify frontend SPA static bundle</text>
            <text class="font-sans card-desc" x="0" y="34">• Package FastAPI application code, requirements &amp; systemd units</text>
            <text class="font-sans card-desc" x="0" y="54">• Publish immutable build drop to Azure Pipeline Artifacts</text>
            <text class="font-sans card-desc" x="0" y="74">• Tag build version for end-to-end traceability</text>
          </g>
        </g>

        <!-- CI Summary Card -->
        <g transform="translate(0, 635)">
          <rect width="420" height="55" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
          <text class="font-sans" x="15" y="24" fill="#0F172A" font-size="11" font-weight="700">CI Result: Verified &amp; Signed Build Drop</text>
          <text class="font-sans card-desc" x="15" y="42">Triggers Continuous Deployment release pipeline to target environments</text>
        </g>
      </g>
    </g>

    <!-- Arrow between Phase 2 and Phase 3 -->
    <path d="M 985 360 L 1025 360" stroke="#16A34A" stroke-width="2.5" fill="none" marker-end="url(#greenArrow)"/>

    <!-- ================= PHASE 3: CONTINUOUS DEPLOYMENT (CD) ================= -->
    <g transform="translate(1010, 30)">
      <rect width="500" height="780" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.2"/>
      <rect x="0" y="0" width="500" height="36" rx="8" fill="#D1FAE5" stroke="#A7F3D0"/>
      <text class="font-sans phase-head" x="18" y="23" fill="#065F46">PHASE 3: CONTINUOUS DEPLOYMENT (CD) TO AZURE</text>

      <g transform="translate(20, 50)">
        <!-- CD Header -->
        <rect width="460" height="70" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
        <text class="font-sans card-title" x="15" y="28">CD Release Pipeline &amp; Promotion Strategy</text>
        <text class="font-sans card-desc" x="15" y="48">Automated Azure Service Connection (SPN) with Scoped RBAC Permissions</text>

        <!-- Target 1: Dev Environment -->
        <g transform="translate(0, 90)">
          <rect width="460" height="135" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
          <rect x="0" y="0" width="460" height="26" rx="8" fill="#10B981"/>
          <text class="font-sans" x="12" y="18" fill="#FFFFFF" font-weight="700" font-size="11">ENVIRONMENT 1: DEV (AUTOMATED CONTINUOUS DEPLOY)</text>

          <g transform="translate(15, 36)">
            <text class="font-sans card-desc" x="0" y="14">• Automatic trigger upon successful CI build drop</text>
            <text class="font-sans card-desc" x="0" y="34">• Sync frontend static files to Azure Storage `$web` container</text>
            <text class="font-sans card-desc" x="0" y="54">• Deploy backend code to Linux VM via Bash script &amp; systemd restart</text>
            <text class="font-sans card-desc" x="0" y="74">• Automated smoke tests: ping health check probe (`/healthz`)</text>
            <text class="font-sans" x="0" y="94" fill="#059669" font-size="10.5" font-weight="600">✔ Status: Verified in Dev Environment</text>
          </g>
        </g>

        <!-- Target 2: Stage Environment -->
        <g transform="translate(0, 245)">
          <rect width="460" height="130" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5"/>
          <rect x="0" y="0" width="460" height="26" rx="8" fill="#0284C7"/>
          <text class="font-sans" x="12" y="18" fill="#FFFFFF" font-weight="700" font-size="11">ENVIRONMENT 2: STAGE (PRE-PRODUCTION VALIDATION)</text>

          <g transform="translate(15, 36)">
            <text class="font-sans card-desc" x="0" y="14">• Automated deployment to isolated staging Azure subscription</text>
            <text class="font-sans card-desc" x="0" y="34">• PostgreSQL schema verification &amp; migration validation</text>
            <text class="font-sans card-desc" x="0" y="54">• End-to-end integration test run against live telecom devices</text>
            <text class="font-sans card-desc" x="0" y="74">• Performance profiling under simulated network load</text>
          </g>
        </g>

        <!-- Prod Approval Gate -->
        <g transform="translate(0, 395)">
          <rect width="460" height="55" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
          <text class="font-sans" x="15" y="24" fill="#92400E" font-weight="700" font-size="11.5">Production Approval Gate (Manual Sign-off)</text>
          <text class="font-sans card-desc" x="15" y="44">Mandatory sign-off by Lead DevOps &amp; Operations before production promotion</text>
        </g>

        <!-- Target 3: Production Environment -->
        <g transform="translate(0, 470)">
          <rect width="460" height="150" rx="8" fill="#F0FDF4" stroke="#059669" stroke-width="2"/>
          <rect x="0" y="0" width="460" height="28" rx="8" fill="#059669"/>
          <text class="font-sans" x="12" y="19" fill="#FFFFFF" font-weight="700" font-size="11.5">ENVIRONMENT 3: PRODUCTION AZURE ENVIRONMENT</text>

          <g transform="translate(15, 38)">
            <text class="font-sans card-desc" x="0" y="14">• Frontend deployed to live Azure Storage Static Website with CDN</text>
            <text class="font-sans card-desc" x="0" y="34">• Zero-downtime rolling reload on Linux VM (Nginx + FastAPI)</text>
            <text class="font-sans card-desc" x="0" y="54">• Private connectivity maintained with Azure PostgreSQL Flexible</text>
            <text class="font-sans card-desc" x="0" y="74">• Prometheus &amp; Azure Monitor active telemetry verification</text>
            <text class="font-sans" x="0" y="96" fill="#065F46" font-size="11" font-weight="700">✔ Enterprise Production Status: HEALTHY &amp; OPERATIONAL</text>
          </g>
        </g>

        <!-- CD Tech Footer -->
        <g transform="translate(0, 640)">
          <rect width="460" height="50" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
          <text class="font-sans" x="15" y="22" fill="#334155" font-size="10.5" font-weight="700">Delivery Stack:</text>
          <text class="font-sans" x="15" y="38" fill="#64748B" font-size="10">Azure DevOps | GitHub Actions | YAML | Git | Terraform | Linux | Nginx | FastAPI | PostgreSQL</text>
        </g>
      </g>
    </g>
  </g>
</svg>