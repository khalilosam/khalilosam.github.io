<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#141E3C" />
      <stop offset="50%" stop-color="#080F24" />
      <stop offset="100%" stop-color="#030611" />
    </radialGradient>
    <radialGradient id="centerWarmth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9E0D" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#FF5722" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="70%" stop-color="#E5A93C" />
      <stop offset="100%" stop-color="#B38018" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <circle cx="600" cy="330" r="450" fill="url(#centerWarmth)" />

  <!-- Subtle Mandala Ring Pattern -->
  <g stroke="#D4AF37" stroke-width="0.8" opacity="0.15" fill="none">
    <circle cx="600" cy="315" r="280" />
    <circle cx="600" cy="315" r="220" stroke-dasharray="4 8" />
    <circle cx="600" cy="315" r="160" />
    <circle cx="600" cy="315" r="100" stroke-dasharray="6 6" />
    <!-- 12 Petal rays -->
    <path d="M 600,35 L 600,595 M 320,315 L 880,315 M 402,117 L 798,513 M 402,513 L 798,117" />
  </g>

  <!-- Decorative Border -->
  <rect x="40" y="40" width="1120" height="550" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4" />
  <rect x="52" y="52" width="1096" height="526" rx="12" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="8 6" opacity="0.25" />

  <!-- Corner Ornaments -->
  <g fill="#D4AF37" opacity="0.6">
    <circle cx="40" cy="40" r="4" />
    <circle cx="1160" cy="40" r="4" />
    <circle cx="40" cy="590" r="4" />
    <circle cx="1160" cy="590" r="4" />
  </g>

  <!-- Top Tag -->
  <text x="600" y="145" text-anchor="middle" fill="#E5A93C" font-family="'Cinzel', Georgia, serif" font-size="16" letter-spacing="8" font-weight="600">✦ FESTIVAL OF LIGHTS, PEACE &amp; TOGETHERNESS ✦</text>

  <!-- Devanagari Title -->
  <text x="600" y="245" text-anchor="middle" fill="url(#goldText)" font-family="'Rozha One', 'Noto Serif Devanagari', serif" font-size="82" font-weight="700" filter="url(#goldGlow)">शुभ दीपावली</text>

  <!-- Subtitle Quote -->
  <text x="600" y="325" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" opacity="0.95" font-weight="300" letter-spacing="0.5">
    “Different traditions, one beautiful humanity. May your life always shine
  </text>
  <text x="600" y="365" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" opacity="0.95" font-weight="300" letter-spacing="0.5">
    with happiness, kindness, and endless possibilities.”
  </text>

  <!-- Center Diya Icon -->
  <g transform="translate(565, 405) scale(1.1)">
    <!-- Flame -->
    <path d="M32 5 C32 5, 23 18, 23 25 C23 30, 27 34, 32 34 C37 34, 41 30, 41 25 C41 18, 32 5, 32 5 Z" fill="#FFB703" filter="url(#goldGlow)" />
    <path d="M32 14 C32 14, 27 21, 27 26 C27 29, 29 31.5, 32 31.5 C35 31.5, 37 29, 37 26 C37 21, 32 14, 32 14 Z" fill="#FFFFFF" />
    <!-- Bowl -->
    <path d="M12 37 C15 48, 25 55, 32 55 C39 55, 49 48, 52 37 C46 39, 38 40, 32 40 C26 40, 18 39, 12 37 Z" fill="#D4AF37" />
    <ellipse cx="32" cy="37" rx="20" ry="4" fill="#FFD700" />
    <path d="M26 54 L24 59 L40 59 L38 54 Z" fill="#996515" />
  </g>

  <!-- Signature -->
  <text x="600" y="520" text-anchor="middle" fill="#E5A93C" font-family="'Cinzel', Georgia, serif" font-size="20" letter-spacing="3" font-weight="400">WARM WISHES,</text>
  <text x="600" y="555" text-anchor="middle" fill="#FFFFFF" font-family="'Cinzel', Georgia, serif" font-size="28" font-weight="700" letter-spacing="2">OSAMA KHALIL</text>
</svg>
