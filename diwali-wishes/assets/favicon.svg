<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="flameCore" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFE066" />
      <stop offset="60%" stop-color="#FF9E0D" />
      <stop offset="90%" stop-color="#FF3E00" />
      <stop offset="100%" stop-color="#B30000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="outerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB703" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FB8500" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050814" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brassBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE57F" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#996515" />
      <stop offset="100%" stop-color="#593905" />
    </linearGradient>
    <linearGradient id="rimHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Light Halo -->
  <circle cx="32" cy="24" r="22" fill="url(#outerAura)" />

  <!-- Diya Flame -->
  <g filter="url(#glow)">
    <path d="M32 5 C32 5, 23 18, 23 25 C23 30, 27 34, 32 34 C37 34, 41 30, 41 25 C41 18, 32 5, 32 5 Z" fill="url(#flameCore)" />
    <!-- Inner bright teardrop -->
    <path d="M32 14 C32 14, 27 21, 27 26 C27 29, 29 31.5, 32 31.5 C35 31.5, 37 29, 37 26 C37 21, 32 14, 32 14 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Wick -->
  <line x1="32" y1="31" x2="32" y2="35" stroke="#331800" stroke-width="1.8" stroke-linecap="round" />

  <!-- Diya Bowl / Base -->
  <path d="M12 37 C15 48, 25 55, 32 55 C39 55, 49 48, 52 37 C46 39, 38 40, 32 40 C26 40, 18 39, 12 37 Z" fill="url(#brassBase)" />
  
  <!-- Diya Rim -->
  <ellipse cx="32" cy="37" rx="20" ry="4" fill="url(#rimHighlight)" stroke="#8C5E0A" stroke-width="0.8" />
  <ellipse cx="32" cy="37" rx="16" ry="2.2" fill="#5E3804" />

  <!-- Ornate Stand Base -->
  <path d="M26 54 L24 59 L40 59 L38 54 Z" fill="url(#brassBase)" />
  <ellipse cx="32" cy="59" rx="8" ry="1.8" fill="#D4AF37" />

  <!-- Sparkle Stars -->
  <circle cx="16" cy="14" r="1.2" fill="#FFE57F" opacity="0.7" />
  <circle cx="48" cy="16" r="1.5" fill="#FFE57F" opacity="0.8" />
  <circle cx="43" cy="8" r="0.8" fill="#FFF" opacity="0.9" />
</svg>
